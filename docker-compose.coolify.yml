# DelQuro Labs — Coolify deployment (Docker Compose build pack).
#
# In Coolify:  New Resource -> Docker Compose (from Git repository)
#              Repository: PlanExServices/DelQuroLabs   Branch: main
#              Docker Compose Location: /docker-compose.coolify.yml
#
# Coolify auto-detects this file, builds the image with the repo's Dockerfile
# and attaches Traefik routing. Set the variables below in the Coolify UI
# (Environment Variables tab) — never commit real values.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:-/}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    image: ${IMAGE:-delqurolabs:coolify}

    # Coolify's Traefik routes by container name; the auto-generated name is
    # shown on the service page. Leave blank to let Coolify manage it, or set
    # COOLIFY_CONTAINER_NAME explicitly for stable routing.
    container_name: ${COOLIFY_CONTAINER_NAME:-delqurolabs}

    restart: unless-stopped

    # No host ports: Traefik reaches the container directly over the
    # `coolify` network. This also means the app is never exposed on the
    # private server's public interface by accident.
    expose:
      - "${APP_PORT:-8080}"

    environment:
      - TZ=${TZ:-UTC}

    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
      - /var/log/nginx:size=8m,mode=0755
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - coolify

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"

      # HTTP -> HTTPS redirect
      - "traefik.http.routers.delqurolabs-http.entryPoints=${COOLIFY_HTTP_ENTRYPOINT:-http}"
      - "traefik.http.routers.delqurolabs-http.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.delqurolabs-http.middlewares=delqurolabs-redirect"
      - "traefik.http.middlewares.delqurolabs-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.delqurolabs-redirect.redirectscheme.permanent=true"

      # HTTPS
      - "traefik.http.routers.delqurolabs.entryPoints=${COOLIFY_ENTRYPOINT:-https}"
      - "traefik.http.routers.delqurolabs.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.delqurolabs.tls=true"
      - "traefik.http.routers.delqurolabs.tls.certresolver=${COOLIFY_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.delqurolabs.loadbalancer.server.port=${APP_PORT:-8080}"
      # Serve the container's own health endpoint to the load balancer.
      - "traefik.http.services.delqurolabs.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.delqurolabs.loadbalancer.healthcheck.interval=30s"

networks:
  # Coolify creates this network when it installs its proxy. Marking it
  # external stops Compose from trying to create/replace it.
  coolify:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}
