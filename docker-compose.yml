# DelQuro Labs — self-hosted stack for a private server.
#
#   cp .env.example .env      # adjust HOST_BIND / HOST_PORT
#   docker compose up -d --build
#
# The app is a static site, so the whole stack is one hardened nginx
# container. Put Traefik, Caddy, nginx or a Cloudflare Tunnel in front of
# it for TLS — see DEPLOY.md.

services:
  web:
    # Build locally from this checkout. To run a prebuilt image instead
    # (e.g. pushed to GHCR by CI), comment out `build` and use `image`.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:-/}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    image: ${IMAGE:-delqurolabs:local}
    container_name: delqurolabs

    # Expose on the private server. Keep HOST_BIND=127.0.0.1 when a reverse
    # proxy terminates TLS in front of this container; use 0.0.0.0 (or the
    # LAN/Tailscale address) when clients reach it directly.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:${APP_PORT:-8080}"

    restart: unless-stopped

    # --- hardening -------------------------------------------------------
    # The container never writes to its own filesystem; nginx's temp and
    # log paths live in RAM.
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
      - /var/log/nginx:size=8m,mode=0755
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # nginx master starts as root and drops to the `nginx` user after
      # binding; these are the capabilities that handoff requires.
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    # --- end hardening ---------------------------------------------------

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      # Consumed by Watchtower-style updaters and handy for humans.
      com.centurylinklabs.watchtower.enable: "false"
      org.opencontainers.image.title: "DelQuro Labs"
      org.opencontainers.image.source: "https://github.com/PlanExServices/DelQuroLabs"
