# nginx server block for the DelQuro Labs static site.
# Mounted at /etc/nginx/conf.d/default.conf in the runtime image.
#
# Notes on header inheritance: any `add_header` inside a `location` block
# cancels the server-level ones, so cache policy in this file is expressed
# with `expires` (which does not break inheritance). Keep it that way.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # ------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # ------------------------------------------------------------------
    # Security headers (inherited by every location below)
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # ------------------------------------------------------------------
    # Health check — used by Coolify, Compose and uptime monitors.
    # Deliberately cheap: no filesystem access, no logging.
    # ------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------
    # Build assets are content-hashed by Vite: safe to cache forever.
    # ------------------------------------------------------------------
    location /assets/ {
        access_log off;
        expires    1y;
        try_files  $uri =404;
    }

    # ------------------------------------------------------------------
    # App screenshots and the favicon. Re-deploying with new artwork
    # keeps the same filename, so use a shorter TTL than /assets/.
    # ------------------------------------------------------------------
    location /images/ {
        access_log off;
        expires    30d;
        try_files  $uri =404;
    }

    location = /favicon.svg {
        access_log off;
        expires    7d;
    }

    # ------------------------------------------------------------------
    # The HTML shell must never be cached, otherwise visitors keep a
    # stale bundle hash after a deploy. `expires -1` emits no-cache
    # without an add_header, preserving the security headers above.
    # ------------------------------------------------------------------
    location = /index.html {
        expires -1;
    }

    # ------------------------------------------------------------------
    # Single-page app routing.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hidden/editor files should never be served.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
